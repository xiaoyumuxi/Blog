name: Import CSDN archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-csdn.py
      - .github/workflows/import-csdn.yml

permissions:
  contents: write

concurrency:
  group: csdn-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 markdownify

      - name: Import public CSDN posts and images
        run: python scripts/import-csdn.py --user fancyfor --download-images --max-image-mb 60

      - name: Commit migrated content
        run: |
          if git status --porcelain -- src/content/blog public/images/csdn | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/content/blog public/images/csdn
            git commit -m 'content: import CSDN blog archive'
            git push origin HEAD:main
          else
            echo 'CSDN archive is already up to date.'
          fi
